# ═══════════════════════════════════════════════════════════════════════
#  SKY NODE — Mac Pro 2013 · Debian 13 · Docker Compose
#
#  WHAT THIS FILE IS
#  A description of every container that makes up Sky, how they connect,
#  and how they know when they're healthy. Docker reads this and makes
#  reality match it.
#
#  HOW IT GETS DEPLOYED
#  Portainer clones this repo and hands this file to Docker. Secrets come
#  from Portainer's environment-variable box, NOT from a .env file — .env
#  is gitignored and therefore absent from the clone (DL-003, DL-008).
#
#  HOW SKY IS REACHED
#    LAN      → Caddy on the host → 127.0.0.1:18090
#    Internet → Cloudflare Access (identity gate) → Tunnel → gateway:8080
#  No inbound ports are open in either case (DL-004, DL-009).
# ═══════════════════════════════════════════════════════════════════════

name: sky

services:

  # ───────────────────────────────────────────────────────────────────
  #  POSTGRES — memory, knowledge, telemetry, audit
  # ───────────────────────────────────────────────────────────────────
  postgres:
    # Built locally so the schema travels inside the image. A bind mount
    # silently resolved to an empty folder under Portainer and Postgres
    # initialized with no schema at all — see DL-007.
    build:
      context: ./db
      dockerfile: Dockerfile
    pull_policy: build
    container_name: sky-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # Named volume — survives redeploys, restarts, and reboots.
    volumes:
      - sky-pgdata:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    # $$ escapes the $ so the shell INSIDE the container expands it,
    # rather than Compose substituting it before the container exists.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    shm_size: 256mb
    networks: [sky]

    # &loglimit names this block so other services reuse it with *loglimit.
    # Caps log size so a chatty container can't slowly fill the disk.
    logging: &loglimit
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────────────
  #  GATEWAY — the front door. Sessions, streaming, telemetry.
  # ───────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    pull_policy: build
    container_name: sky-gateway
    restart: unless-stopped

    environment:
      # ${VAR:-default} = "use VAR, or this fallback." Only real secrets
      # are left without a default, so their absence fails loudly.
      SKY_IDENTITY_NAME: ${SKY_IDENTITY_NAME:-Sky Prime}
      SKY_ADDRESS_NAME: ${SKY_ADDRESS_NAME:-Sky}
      SKY_ENV: ${SKY_ENV:-production}
      SKY_VERSION: ${SKY_VERSION:-0.1.0-phase0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-}

      # "postgres" is the SERVICE NAME above. Docker's internal DNS
      # resolves it to that container. "localhost" would mean the gateway.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      SKY_MONTHLY_COST_CAP_USD: ${SKY_MONTHLY_COST_CAP_USD:-50}
      SKY_COST_ALERT_THRESHOLD: ${SKY_COST_ALERT_THRESHOLD:-0.75}

    # Wait for Postgres to report HEALTHY, not merely to exist.
    depends_on:
      postgres:
        condition: service_healthy

    # 8080 inside, published as 18090 on the host because CasaOS owns 8080.
    # Caddy reaches it here. cloudflared does NOT — it uses gateway:8080
    # over the internal network.
    ports:
      - "127.0.0.1:18090:8080"

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks: [sky]
    logging: *loglimit

  # ───────────────────────────────────────────────────────────────────
  #  CLOUDFLARED — the public path
  #
  #  Dials OUT to Cloudflare and holds the connection open. Nothing on
  #  the router listens, so there is no inbound surface to scan (DL-004).
  #
  #  ← CHANGED: `profiles: [tunnel]` removed. That flag meant the service
  #    only started with `docker compose --profile tunnel up`, and
  #    Portainer has no way to pass it. The service would simply never
  #    have appeared, with no error to explain why.
  #
  #  ⚠️ Cloudflare ACCESS sits in front of this at Cloudflare's edge.
  #     An unauthenticated request is stopped there and never reaches
  #     this container. The tunnel carries traffic; it does not guard it.
  # ───────────────────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sky-tunnel
    restart: unless-stopped

    # No default on the token: an empty one should fail loudly rather
    # than start a connector that quietly connects to nothing.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

    # Don't publish Sky to the internet until she's actually answering.
    depends_on:
      gateway:
        condition: service_healthy

    networks: [sky]
    logging: *loglimit

volumes:
  sky-pgdata:
    name: sky-pgdata

networks:
  sky:
    name: sky
    driver: bridge
