name: sky

# ═══════════════════════════════════════════════════════════════════════
#  SKY NODE — Mac Pro 2013 · Debian 13 · Docker Compose
#
#  Deployed via Portainer Repository stack. Secrets come from Portainer's
#  environment variables, NOT from a .env file — .env is gitignored and
#  therefore absent from the clone. That is intentional (DL-003).
#
#  Nothing binds to a routable interface. Caddy fronts the gateway.
# ═══════════════════════════════════════════════════════════════════════

services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: sky-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - sky-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    shm_size: 256mb
    networks: [sky]
    logging: &loglimit
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: sky-gateway
    restart: unless-stopped
    environment:
      SKY_IDENTITY_NAME: ${SKY_IDENTITY_NAME:-Sky Prime}
      SKY_ADDRESS_NAME: ${SKY_ADDRESS_NAME:-Sky}
      SKY_ENV: ${SKY_ENV:-production}
      SKY_VERSION: ${SKY_VERSION:-0.1.0-phase0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SKY_MONTHLY_COST_CAP_USD: ${SKY_MONTHLY_COST_CAP_USD:-50}
      SKY_COST_ALERT_THRESHOLD: ${SKY_COST_ALERT_THRESHOLD:-0.75}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18090:8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [sky]
    logging: *loglimit

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sky-tunnel
    restart: unless-stopped
    profiles: [tunnel]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      gateway:
        condition: service_healthy
    networks: [sky]
    logging: *loglimit

volumes:
  sky-pgdata:
    name: sky-pgdata

networks:
  sky:
    name: sky
    driver: bridge
